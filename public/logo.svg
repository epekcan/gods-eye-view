<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 520" width="100%" height="100%">
  <defs>
    <!-- Radar Derinlik Gradyanı -->
    <radialGradient id="radarSweepGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a44" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#ff2a44" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.95" />
    </radialGradient>
    <clipPath id="radarScopeClip">
      <circle cx="387.5" cy="260" r="148" />
    </clipPath>
  </defs>

  <!-- 1. DIŞ GÖZ ÇERÇEVESİ (Taktik Koyu Gövde & Kırmızı Hat) -->
  <path d="M 24 260 C 130 110, 645 110, 751 260 C 645 410, 130 410, 24 260 Z" 
        fill="#0d0d12" stroke="#ff2a44" stroke-width="12" stroke-linejoin="round" />
  
  <path d="M 54 260 C 150 138, 625 138, 721 260 C 625 382, 150 382, 54 260 Z" 
        fill="#14141c" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4" />

  <!-- 2. SAĞ VE SOL OPTİK VİZÖR YAYLARI (HUD Braketleri) -->
  <path d="M 160 195 C 142 215, 132 238, 132 260 C 132 282, 142 305, 160 325 L 140 338 C 120 312, 108 286, 108 260 C 108 234, 120 208, 140 182 Z" 
        fill="#ffffff" stroke="#ff2a44" stroke-width="5" />
        
  <path d="M 615 195 C 633 215, 643 238, 643 260 C 643 282, 633 305, 615 325 L 635 338 C 655 312, 667 286, 667 260 C 667 234, 655 208, 635 182 Z" 
        fill="#ffffff" stroke="#ff2a44" stroke-width="5" />

  <!-- 3. MERKEZ RADAR EKRANI -->
  <circle cx="387.5" cy="260" r="148" fill="url(#radarSweepGlow)" stroke="#ff2a44" stroke-width="8" />

  <!-- 4. RADAR İÇ ELEMANLARI (Kapsama ve Tarama Katmanı) -->
  <g clip-path="url(#radarScopeClip)">
    <!-- Radar Tarama Sektörü (Sweep Cone) -->
    <path d="M 387.5 260 L 520 150 A 148 148 0 0 0 387.5 112 Z" fill="#ff2a44" fill-opacity="0.25" />

    <!-- Mesafe Halka Katmanları (Range Rings) -->
    <circle cx="387.5" cy="260" r="110" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="6 4" stroke-opacity="0.45" />
    <circle cx="387.5" cy="260" r="72" fill="none" stroke="#ff2a44" stroke-width="2" stroke-opacity="0.8" />
    <circle cx="387.5" cy="260" r="34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Taktik Koordinat / Crosshair Eksenleri -->
    <line x1="387.5" y1="112" x2="387.5" y2="408" stroke="#ff2a44" stroke-width="2" stroke-opacity="0.75" />
    <line x1="239.5" y1="260" x2="535.5" y2="260" stroke="#ff2a44" stroke-width="2" stroke-opacity="0.75" />
    <line x1="300" y1="172.5" x2="475" y2="347.5" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.35" />
    <line x1="300" y1="347.5" x2="475" y2="172.5" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.35" />

    <!-- Tespit Edilen Canlı Hedef Noktaları (Contacts) -->
    <polygon points="445,195 452,207 438,207" fill="#ffffff" stroke="#ff2a44" stroke-width="1.5" />
    <circle cx="335" cy="225" r="4.5" fill="#ff2a44" />
    <circle cx="335" cy="225" r="9" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" />
    <rect x="420" y="300" width="7" height="7" fill="#ffffff" />
  </g>

  <!-- 5. RADAR ÇEVRESİ AÇI ÇENTİKLERİ (Compass Ticks) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="387.5" y1="104" x2="387.5" y2="116" />
    <line x1="387.5" y1="404" x2="387.5" y2="416" />
    <line x1="231.5" y1="260" x2="243.5" y2="260" />
    <line x1="531.5" y1="260" x2="543.5" y2="260" />
  </g>

  <!-- Merkez Kilitlenme Noktası -->
  <circle cx="387.5" cy="260" r="5" fill="#ff2a44" />
  <circle cx="387.5" cy="260" r="1.5" fill="#ffffff" />
  <circle cx="387.5" cy="260" r="148" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5" />
</svg>
